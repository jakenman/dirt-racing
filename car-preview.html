<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sprint Car Preview</title>
<style>
html,body{margin:0;height:100%;background:#0a0c14;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
#info{position:fixed;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:10px;font-size:13px;max-width:90%}
a{color:#ffd080}
</style>
</head>
<body>
<div id="info">
  <b>Sprint car .glb preview</b><br/>
  Drag to orbit · Pinch zoom<br/>
  <a href="index.html">← Back to game</a>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js"}}
</script>
<script type="module">
import * as T from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js';

const scene = new T.Scene();
scene.background = new T.Color(0x0a0c14);
const camera = new T.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.2, 1.8, 3.5);
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if (T.sRGBEncoding != null) renderer.outputEncoding = T.sRGBEncoding;
else if (T.SRGBColorSpace != null) renderer.outputColorSpace = T.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new T.HemisphereLight(0x6a7a9a, 0x2a1810, 0.55));
const key = new T.DirectionalLight(0xffd0a0, 1.2);
key.position.set(4, 8, 3);
scene.add(key);
const fill = new T.PointLight(0xffc888, 1.4, 20);
fill.position.set(0, 3, 0);
scene.add(fill);

const grid = new T.GridHelper(12, 12, 0x333344, 0x222230);
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.update();

const loader = new GLTFLoader();
loader.load('sprint_car.glb', (gltf) => {
  const car = gltf.scene;
  car.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  scene.add(car);
  document.getElementById('info').innerHTML += '<br/><span style="color:#8f8">Loaded sprint_car.glb</span>';
}, undefined, (err) => {
  document.getElementById('info').innerHTML += '<br/><span style="color:#f88">Load error: '+err+'</span>';
  console.error(err);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
